schema_version = 1
expected_account = "123456789012" # Replace with your intended AWS account.
region = "us-east-2" # Current foundation supports Ohio only.
deployment = "personal-dev"
owner = "replace-with-stable-owner" # Keep this fixed across machines and logins.
aws_profile = "devbox" # Existing AWS shared configuration profile; no credentials here.
manifest = "deployment.json" # Relative to this config file.
# Maximum instances per request: integer 1–100, default 10 when omitted.
# TOML overrides the default; there is no environment or CLI override.
max_count = 10
# Fresh launch lifetime; no environment/profile override. Requires foundation v6.
default_ttl = "2h" # up --ttl overrides; positive Go duration, maximum 168h.
# One deadline per request; active work and retries do not extend it.
# Verify scheduled cleanup for this deployment; use down for deliberate teardown.
# profile_file = "agent.toml" # Optional; defaults to the embedded agent profile.

# Dedicated Ed25519 private key stays local; retain its matching .pub file.
# Relative paths resolve beside this config; no tilde/environment expansion.
# ssh_identity_file = "/home/YOU/.ssh/devbox_ed25519"
